name: LeanDoc CI

on:
  push:
    branches: [main]
    paths: ['LeanDoc/**', '.github/workflows/leandoc-ci.yml']
  pull_request:
    branches: [main]
    paths: ['LeanDoc/**', '.github/workflows/leandoc-ci.yml']

defaults:
  run:
    working-directory: LeanDoc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build artifacts
        uses: actions/cache@v4
        with:
          path: |
            LeanDoc/.lake
            LeanDoc/demo/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('LeanDoc/lean-toolchain', 'LeanDoc/lakefile.toml', 'LeanDoc/lake-manifest.json', 'LeanDoc/demo/lean-toolchain', 'LeanDoc/demo/lakefile.toml', 'LeanDoc/demo/lake-manifest.json') }}

      - name: lake build
        run: lake build

      - name: Run test suite (task T24)
        run: lake exe leandoc-test

      - name: Run extractor + renderer on demo/
        run: lake exe leandoc demo

      - name: Run extractor + renderer on LeanDoc itself
        run: lake exe leandoc

      - name: Check generated docs are committed and up to date
        run: |
          PATHS="docs/reference demo/docs/reference docs/toc.md demo/docs/toc.md docs/index.md demo/docs/index.md"
          if [ -n "$(git status --porcelain -- $PATHS)" ]; then
            echo "::error::Generated docs are out of date or uncommitted." >&2
            echo "Run 'lake exe leandoc' and 'lake exe leandoc demo' locally, then commit the result." >&2
            git status --porcelain -- $PATHS
            git --no-pager diff -- $PATHS
            exit 1
          fi
