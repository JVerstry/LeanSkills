
# LeanDoc documenting itself (task T13 — dogfooding). See
# demo/leandoc.toml for the schema reference, and InstallationPrompt.txt
# / wip/todo.md task T8 for the rationale.

[output]
json_dir = ".leandoc/"
docs_dir = "docs/"

[modules]
# include = [...]   # left empty to test T21's lean_exe discovery path
# `Test` (task T24's test/Test.lean, srcDir = "test") is excluded for
# two reasons: it's internal tooling, not public API worth documenting
# either way, and T21's whole-package scanning doesn't understand
# per-target `srcDir` yet (a real, known limitation — see wip/todo.md).
exclude = ["Test"]

[renderer]
name = "markdown"
