
# LeanDoc configuration for this project. See LeanDoc's own
# InstallationPrompt.txt / wip/todo.md (task T8) for the schema
# rationale. All fields shown here are also the defaults.
#
# `[modules] include` is deliberately left empty here (task T21): with
# no explicit list, LeanDoc scans this project's own lakefile.toml
# (the `[[lean_lib]] name = "Demo", globs = ["Demo.+"]` entry) to
# discover `Demo.MyLeanFile` on its own, rather than being told about
# it by hand — this is the whole-package-scanning test case.

[output]
# Intermediate metadata JSON — build-artifact territory, gitignored.
json_dir = ".leandoc/"
# Final rendered docs — defaults to `docs/` so GitHub Pages can serve
# it straight from `main` with zero extra config.
docs_dir = "docs/"

[modules]
# include = [...]   # left empty on purpose — see note above
# exclude = [...]

[renderer]
# Reserved for T9's future renderer choice — Markdown is the only one
# that exists, so this isn't acted on yet.
name = "markdown"
