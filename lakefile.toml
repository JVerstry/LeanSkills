name = "LeanDoc"
defaultTargets = ["leandoc"]

# The reusable extractor/renderer logic (task T24) — imported by both
# the `leandoc` executable and the `test` one below, so it's only
# written and tested once.
[[lean_lib]]
name = "LeanDoc"
globs = ["LeanDoc.+"]

[[lean_exe]]
name = "leandoc"
root = "Main"
# Needed because the extractor calls into Lean's own frontend/elaborator
# (Lean.Elab.runFrontend), which requires the interpreter to be linked in.
supportInterpreter = true

# Task T24: functionality + non-regression tests, kept in test/ rather
# than mixed into the package's own module namespace.
[[lean_exe]]
name = "test"
root = "Test"
srcDir = "test"
supportInterpreter = true
