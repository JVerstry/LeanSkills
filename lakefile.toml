name = "LeanDoc"
defaultTargets = ["leandoc"]

# The reusable extractor/renderer logic (task T24) — imported by both
# the `leandoc` executable and the `test` one below, so it's only
# written and tested once.
[[lean_lib]]
name = "LeanDoc"
globs = ["LeanDoc.+"]

[[lean_exe]]
name = "leandoc"
root = "Main"
# Needed because the extractor calls into Lean's own frontend/elaborator
# (Lean.Elab.runFrontend), which requires the interpreter to be linked in.
supportInterpreter = true

# Task T24: functionality + non-regression tests, kept in test/ rather
# than mixed into the package's own module namespace. Named
# `leandoc-test`, not the generic `test` (task T36, 2026-09-22): a
# plain `test` executable target is exposed to any project that
# requires LeanDoc as a dependency — `lake exe` resolves executables
# from dependencies the same way as the current package's own — so an
# installing user typing `lake exe test` for their *own* unrelated test
# runner would silently invoke LeanDoc's instead, crashing with a
# confusing raw exception (it assumes LeanDoc's own repo layout,
# `demo/`, is present). Confirmed empirically before this rename.
[[lean_exe]]
name = "leandoc-test"
root = "Test"
srcDir = "test"
supportInterpreter = true
